<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inloggen — SLN Meta Ads</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dark: #0D1B2A; --accent: #E8541A; --accent2: #FF7043;
      --bg: #F4F6FA; --surface: #FFFFFF; --border: #E2E8F0;
      --text: #0F172A; --muted: #64748B;
    }
    * { font-family: 'Inter', system-ui, sans-serif; }
    body {
      background: linear-gradient(135deg, var(--dark) 0%, #1A3A5C 60%, #1e4d8c 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .logo-icon {
      width: 52px; height: 52px;
      background: var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #fff;
      margin: 0 auto 1.25rem;
    }
    .login-title { font-size: 1.4rem; font-weight: 800; color: var(--dark); text-align: center; }
    .login-sub   { font-size: .85rem; color: var(--muted); text-align: center; margin-top: .25rem; margin-bottom: 1.75rem; }
    .form-label  { font-size: .78rem; font-weight: 600; color: var(--text); margin-bottom: .35rem; }
    .form-control {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: .88rem;
      padding: .6rem .9rem;
      transition: border-color .15s;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,84,26,.12); }
    .btn-login {
      background: var(--accent); color: #fff; border: none;
      width: 100%; padding: .7rem; border-radius: 10px;
      font-weight: 700; font-size: .95rem;
      margin-top: 1.25rem;
      transition: background .15s, transform .1s;
    }
    .btn-login:hover { background: var(--accent2); transform: translateY(-1px); }
    .alert-danger { font-size: .82rem; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-icon">SLN</div>
    <div class="login-title">Meta Ads Analyzer</div>
    <div class="login-sub">SLN Solutions — intern dashboard</div>

    {% if error %}
    <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label">Gebruikersnaam</label>
        <input type="text" name="username" class="form-control" placeholder="dominique of rick" autofocus required />
      </div>
      <div class="mb-1">
        <label class="form-label">Wachtwoord</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-login">Inloggen <i class="bi bi-arrow-right ms-1"></i></button>
    </form>
  </div>
</body>
</html>
